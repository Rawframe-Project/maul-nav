# The pull request title becomes the commit on main and the changelog
# line, so it must be a conventional commit with one of the scopes
# AGENTS.md lists.
name: pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    uses: Rawframe-Project/.github/.github/workflows/pr-title.yml@370ea6e86b4292fcdd29270f260604d71a3b9bc8 # v0.0.16
    permissions:
      pull-requests: read
    with:
      scopes: bake format cache navmesh links query corridor hierarchy flow avoidance flight debug samples build bench family
