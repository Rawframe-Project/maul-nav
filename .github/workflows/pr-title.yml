# The pull request title becomes the commit on main and the changelog
# line, so it must be a conventional commit with one of the scopes
# AGENTS.md lists.
name: pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    uses: Rawframe-Project/.github/.github/workflows/pr-title.yml@c836a14bfdf2ed83329d08e6bd6d7667fac3e8d2 # v0.0.10
    permissions:
      pull-requests: read
    with:
      scopes: bake format cache navmesh links query corridor hierarchy flow avoidance flight debug samples build bench family
