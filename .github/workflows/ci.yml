# Continuous integration: the pull request check, the full check on main,
# and every night the large scenes and long fuzzing. Each build cell is a
# CMake preset built by the organization's shared workflow; the other jobs
# run in the same CI image. Every test cell checks the golden values, so all
# cells agree on every bit. docs/operations/checks.md explains each job, and
# tools/check.sh runs the Linux ones locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      fuzz-seconds:
        description: Seconds each target runs in fuzz-night, 1 to 1500 (the night's run is 600)
        type: number
        default: 600

# A new push to a pull request cancels its running CI; runs on main get a
# group of their own, so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  PREFIX: MAUL_NAV

jobs:
  # Whether anything beyond documentation changed; the builds skip when not.
  changes:
    uses: Rawframe-Project/.github/.github/workflows/changes.yml@56543e92d01e59abdb4299c4824a0c1facdc08ce # v0.0.25
    permissions:
      pull-requests: read

  # The organization's documentation check, run from the pinned commit of
  # .github.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Rawframe-Project/.github/.github/actions/docs-check@56543e92d01e59abdb4299c4824a0c1facdc08ce # v0.0.25

  zizmor:
    uses: Rawframe-Project/.github/.github/workflows/zizmor.yml@56543e92d01e59abdb4299c4824a0c1facdc08ce # v0.0.25
    permissions:
      contents: read

  # The rules no compiler checks: formatting, the family's source, module,
  # API documentation, length and snippet checks, test hygiene and labels,
  # the documentation site, and clang-tidy. It runs on documentation changes too, since the snippet
  # check and the site read docs/.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clang-format
        run: |
          clang-format --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          files=$(git ls-files 'include/*.h' 'src/*.[ch]' 'test/*.[ch]' 'tools/*.[ch]' 'bench/*.[ch]' \
            'samples/*.[ch]')
          [ -n "$files" ] || { echo "::error::no files to format"; exit 1; }
          echo "$files" | xargs clang-format --dry-run -Werror
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_float_env.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
      # The tests themselves, then every test registration in the
      # configurations that add tests: the default one, with the samples,
      # and the shared build's exports and package tests.
      - name: Test hygiene
        run: |
          python3 tools/check_test_hygiene.py --self-test
          python3 tools/check_test_hygiene.py
          cmake -B out/hygiene -G Ninja -DCMAKE_C_COMPILER=clang-20 >/dev/null
          cmake -B out/hygiene-shared -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_BUILD_SHARED=ON \
            -D${PREFIX}_TEST_PACKAGE=ON >/dev/null
          python3 tools/check_test_hygiene.py --ctest out/hygiene --ctest out/hygiene-shared
      - name: The documentation site builds
        run: python3 tools/build_docs.py
      - name: The hand tiles are what their writer writes
        run: |
          cmake -B out/hand -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_BUILD_BENCH=OFF \
            -D${PREFIX}_BUILD_SAMPLES=OFF
          cmake --build out/hand --target test_hand_tiles
          out/hand/test_hand_tiles --check test/hand_tiles.h
      - name: clang-tidy
        run: |
          cmake -B out/tidy -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_BUILD_BENCH=OFF -D${PREFIX}_BUILD_SAMPLES=OFF
          files=(src/*.c)
          [ -e "${files[0]}" ] || { echo "::error::no sources for clang-tidy"; exit 1; }
          for f in "${files[@]}"; do
            clang-tidy-20 -p out/tidy --quiet --warnings-as-errors='*' "$f"
          done

  # Every cell builds with warnings as errors and runs the whole suite but
  # the large scenes, the golden values and the header tests included. GCC
  # 14 builds every part, the Recast differential with it; the Clang Release,
  # shared, macOS and Windows cells install the library and build
  # samples/minimal against it (the "package" test).
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc-14 }
          - { preset: linux-clang-20 }
          - { preset: linux-clang-20-asan, repeat: 3 }
          - { preset: linux-clang-20-tsan }
          - { preset: linux-shared }
          - { preset: linux-arm64-gcc-14, runner: ubuntu-24.04-arm }
          - { preset: macos-clang, runner: macos-15 }
          - { preset: windows-clang-cl, runner: windows-2025 }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@56543e92d01e59abdb4299c4824a0c1facdc08ce # v0.0.25
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      repeat: ${{ matrix.repeat || 1 }}

  # The public headers alone under MSVC's cl, as C17 and C++17 with /W4 /WX:
  # consumers may compile them with it, though it cannot build the library.
  msvc-headers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B out/headers
          cmake --build out/headers --config Release

  # The library and its tests under Emscripten and Node, and the size of the
  # static library. The CI image has no Emscripten, so this job uses the
  # runner and the emsdk action; it checks for skipped tests and keeps the
  # logs of a failure as cpp.yml does.
  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      - name: Configure
        run: cmake --preset web-emscripten
      - name: Build
        run: cmake --build --preset web-emscripten -j 4
      - name: Test
        run: |
          ctest --preset web-emscripten --no-tests=error | tee "$RUNNER_TEMP/ctest.log"
          # A skipped, disabled or missing test fails the cell: it would hide
          # a check that no longer runs.
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-web-emscripten
          path: out/web-emscripten/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
      - name: Size
        # The static library's size, reported, not gated.
        run: stat -c '%s bytes' out/web-emscripten/libmaul-nav.a

  # Every fuzz target from its committed seeds, four at a time, briefly: on
  # pull requests and on main. The night's long run is fuzz-night. Each
  # target runs through tools/fuzz_target.sh, which keeps its log and any
  # finding on the runner and prints a finding's report without its input;
  # nothing is uploaded.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
    permissions:
      contents: read
    env:
      FUZZ_SECONDS: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: tools/fuzz.sh build out/fuzz
      - name: Seeds
        run: tools/fuzz.sh seeds out/fuzz
      - name: Run
        # The step pattern of tools/fuzz_target.sh: the reports cleared, the
        # targets' status kept, and every report printed once they finish.
        run: |
          rm -rf out/fuzz-reports
          status=0
          printf '%s\n' out/fuzz/fuzz_* |
            xargs -P 4 -I {} sh -c 'tools/fuzz_target.sh "$1" -max_total_time="$FUZZ_SECONDS" -timeout=30 "out/corpus-run/${1##*/}"' _ {} ||
            status=$?
          cat out/fuzz-reports/*.txt 2>/dev/null || true
          exit "$status"

  # The fuzz targets the build defines, so that a new one runs at night
  # without a list to keep.
  fuzz-targets:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List
        id: list
        # Assigned first, so that a failed listing fails the step.
        run: |
          targets=$(tools/fuzz.sh targets out/fuzz)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  # Every night, each target alone for ten minutes, from the corpus the last
  # night left in its cache and the committed seeds; the merged corpus is
  # saved for the next night when the target found nothing.
  fuzz-night:
    needs: fuzz-targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the corpus
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/${{ matrix.target }}
          key: corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: corpus-${{ matrix.target }}-
      - name: Build
        run: tools/fuzz.sh build out/fuzz
      - name: Run
        env:
          TARGET: ${{ matrix.target }}
          # A scheduled run has no inputs, so it takes the full 600.
          FUZZ_SECONDS: ${{ inputs.fuzz-seconds || 600 }}
        run: tools/fuzz.sh night out/fuzz "$TARGET" "$FUZZ_SECONDS"
      # Only a run that found nothing saves its corpus.
      - name: Save the corpus
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/${{ matrix.target }}
          key: corpus-${{ matrix.target }}-${{ github.run_id }}

  # Every night, what the pull request check leaves out: the large scenes
  # (the 1,000-agent doorway crowd, with its golden value), and the suites'
  # dense forms under AddressSanitizer, which every other cell runs on a
  # pull request.
  scenes:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake --preset linux-clang-20
          cmake --build --preset linux-clang-20
          cmake --preset linux-clang-20-asan
          cmake --build --preset linux-clang-20-asan
      - name: Test
        run: |
          ctest --preset nightly --no-tests=error | tee "$RUNNER_TEMP/ctest.log"
          ctest --preset dense-asan --no-tests=error | tee -a "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-nightly
          path: |
            out/linux-clang-20/Testing/Temporary/
            out/linux-clang-20-asan/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # The one check the ruleset requires: it passes when every job above
  # passed or was skipped, for a documentation-only change or because it
  # runs at night only, so adding or renaming a job never touches the
  # ruleset.
  required:
    if: always()
    needs: [changes, docs, zizmor, checks, build, msvc-headers, web, fuzz, fuzz-targets, fuzz-night,
            scenes]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
