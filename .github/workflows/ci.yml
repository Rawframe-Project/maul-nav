# Continuous integration for Maul Nav.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PREFIX: MAUL_NAV

jobs:
  # The rules no compiler checks: formatting, static analysis and the
  # family's source, module, documentation and length checks.
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-20 clang-tidy-20 ninja-build
          pip install clang-format==22.1.5 >/dev/null
      - name: clang-format
        run: |
          clang-format --version
          clang-format --dry-run -Werror $(find include src test tools bench samples -name '*.[ch]' 2>/dev/null)
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_guide.py
          python3 tools/check_lengths.py
      - name: API reference
        # docs/api.md is what the generator makes from the headers, and
        # the README gives its function count.
        run: |
          COUNT=$(python3 tools/gen_api.py | grep -oE '\([0-9]+ functions\)' | grep -oE '[0-9]+')
          git diff --exit-code docs/api.md || { echo "docs/api.md is stale: run tools/gen_api.py"; exit 1; }
          grep -q "$COUNT public functions" README.md || { echo "README says the wrong function count ($COUNT)"; exit 1; }
      - name: clang-tidy
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          for f in src/*.c; do
            clang-tidy-20 -p build --quiet --warnings-as-errors='*' "$f" || exit 1
          done

  # Every cell builds with warnings as errors and runs the whole suite,
  # the header tests included.
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc-14,        os: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     config: Release, extra: "" }
          - { name: linux-clang-20,      os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Release, extra: "" }
          - { name: linux-clang-20-asan, os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_NAV_SANITIZE=ON" }
          - { name: linux-clang-20-tsan, os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_NAV_TSAN=ON" }
          - { name: linux-shared,        os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Release, extra: "-DMAUL_NAV_BUILD_SHARED=ON" }
          - { name: linux-arm64-gcc-14,  os: ubuntu-24.04-arm, cc: gcc-14, cxx: g++-14,   config: Release, extra: "" }
          - { name: macos-clang,         os: macos-15,     cc: clang,    cxx: clang++,    config: Release, extra: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-14 g++-14 clang-20 ninja-build
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -D${PREFIX}_WERROR=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.extra }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        if: matrix.name == 'linux-shared'
        run: |
          cmake --install build --prefix "$PWD/package"
          cmake -S samples/minimal -B build-minimal -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_PREFIX_PATH="$PWD/package"
          cmake --build build-minimal
          LD_LIBRARY_PATH="$PWD/package/lib" ./build-minimal/minimal

  windows-clang-cl:
    name: windows-clang-cl
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -T ClangCL -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Headers under MSVC
        # The public headers alone under cl's /W4 /WX, in C++17 (family record 0008).
        run: |
          cmake -S cmake/HeaderCheck -B build-headers
          cmake --build build-headers --config Release

  web:
    name: web-emscripten
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Configure
        run: emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: |
          for t in build/test_*.js; do node "$t" || exit 1; done
      - name: Size
        # The static library's size, reported, not gated (family record
        # 0013).
        run: stat -c '%s bytes' build/libmaul-nav.a

  # The differential harness against Recast and Detour (mnav-0011): path
  # lengths and reachability on the scenario corpus, test only.
  differential:
    name: differential
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-14 g++-14
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_DIFFERENTIAL=ON \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build --target differential -j4
      - name: Run
        run: build/differential

  # Each fuzz target runs for one minute on every push, from the seed
  # corpus in test/corpus (minimized from local campaigns): the tile loader
  # from its seed, the bake input, the query inputs, avoidance input, the
  # searches over the whole navmesh, the runtime navmesh's changes and grid
  # flow fields.
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-20 ninja-build
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON \
            -D${PREFIX}_WERROR=ON
          cmake --build build
      - name: Run
        run: |
          mkdir -p corpus-fuzz_tile
          build/test_tile --seed corpus-fuzz_tile/level.tile
          for target in build/fuzz_*; do
            name=$(basename $target)
            mkdir -p "corpus-$name"
            tar -xzf "test/corpus/$name.tar.gz" -C "corpus-$name"
            "$target" -max_total_time=60 "corpus-$name"
          done
